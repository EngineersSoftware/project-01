<section class="profile">
  <div class="avatar" aria-hidden="true">{{ initial() }}</div>
  <p class="eyebrow">Perfil</p>
  <h1>{{ auth.username() }}</h1>
  <p class="note">Estos datos salen del token que devolvió el login. No hay otra cuenta guardada en el navegador.</p>

  <dl>
    <div>
      <dt>Usuario</dt>
      <dd>{{ auth.username() }}</dd>
    </div>
    <div>
      <dt>Rol</dt>
      <dd>USER</dd>
    </div>
    <div>
      <dt>La sesión vence</dt>
      <dd>{{ expiresLabel() }}</dd>
    </div>
  </dl>

  <button type="button" (click)="logout()">Cerrar sesión</button>
</section>
